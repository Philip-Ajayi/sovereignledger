version: '3.8'

services:
  sovereignledger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sovereignledger-core
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SOVEREIGN_ENV=production
      - SOVEREIGN_DATA_DIR=/data/incoming
      - SOVEREIGN_DB_PATH=/db/sovereignledger.duckdb
      - SOVEREIGN_SQLITE_PATH=/db/episodic_memory.sqlite3
      - SOVEREIGN_SKILLS_DIR=/skills
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=nvidia/Mistral-NeMo-12B-Instruct:latest
      - STRICT_ZERO_EGRESS=true
    volumes:
      - ./data/incoming:/data/incoming:rw
      - ./db:/db:rw
      - ./skills:/skills:rw
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - CHOWN
      - SETUID
      - SETGID
    extra_hosts:
      - "host.docker.internal:host-gateway"
